name: HoYoLAB 自動チェックイン

on:
  schedule:
    # 毎日 UTC 00:00 = 日本時間 09:00 に実行
    - cron: '0 0 * * *'
  workflow_dispatch:  # 「Actions」タブから手動実行も可能

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なライブラリをインストール
        run: pip install requests

      - name: チェックインを実行
        env:
          # --- 認証情報（どちらか一方を登録すればOK） ---
          # 方法A: Cookie文字列をそのまま登録する場合
          HOYOLAB_COOKIE: ${{ secrets.HOYOLAB_COOKIE }}
          # 方法B: LTUID と LTOKEN を別々に登録する場合
          LTUID:  ${{ secrets.LTUID }}
          LTOKEN: ${{ secrets.LTOKEN }}
          # --- Discord通知（任意） ---
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python checkin.py
